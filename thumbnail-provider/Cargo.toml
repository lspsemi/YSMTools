[package]
name = "ysm-thumbnail"
version = "1.0.0"
description = "Windows Explorer thumbnail provider for .ysm models (docs/maintenance section 70)"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MioNext"]

# Kept apart from src-tauri on purpose: Explorer loads this DLL into its own
# thumbnail process, so it must not pull in the app (docs section 70).
[lib]
name = "ysm_thumbnail"
crate-type = ["cdylib"]

[dependencies]
png = "0.17"
sha2 = "0.10"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# unwind, not abort: the DLL runs inside Explorer and catches its panics.
panic = "unwind"
strip = true
